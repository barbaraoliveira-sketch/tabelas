<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplos de Tabelas</title>

    <link rel="stylesheet" href="./css/global.css">
</head>
<body>
    <main class="main-content">
    <header class="header-title">
        <h1>Exemplos de Tabelas</h1>
        <!--Túitulo para tabela -->
        <h2>Notas 1DS - SESI</h2>
    </header>
    
        <!-- Container para a tabela -->
         <table class="table-main">
            <tr class="title-tr">
                <th colspan = "4">Notas 1DS - SESI</th>
            </tr>
            <tr>
                <th  colspan = "4">.</th>
                
            </tr>
            <thead>
                <!-- Criar uma linha na tabela tr = table row -->
                <tr>
                    <!-- Criar os cabeçalhos das linhas da tabela th = table header-->
                    <th>Aluno</th>
                    <th>Professor</th>
                    <th>Disciplina</th>
                    <th>Nota</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Júlia</td>
                    <td>Celso</td>
                    <td>Física</td>
                    <td>10</td>
                </tr>
                <tr>
                    <td>Barbara</td>
                    <td>Liliane</td>
                    <td>Química</td>
                    <td>9,8</td>
                </tr>
                <tr>
                    <td>Davi</td>
                    <td>Sandra</td>
                    <td>Biologia</td>
                    <td>8,7</td>
                </tr>
            </tbody>
            <foot>
                <tr>
                    <td>dados referentes ao 1 semestre de 2026</td>
                </tr>
            </foot>
         </table>
    </main>
</body>
</html>
