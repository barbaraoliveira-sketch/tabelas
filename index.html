<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplos de Tabelas</title>

    <link rel="stylesheet" href="./css/global.css">
</head>
<body>
    <header class="header-title">
        <h1>Exemplos de Tabelas</h1>
        <!--Túitulo para tabela -->
        <h2>Notas 1DS - SESI</h2>
    </header>
    <main class="main-content">
        <!-- Container para a tabela -->
         <table>
            <!-- Criar uma linha na tabela tr = table row -->
            <tr>
                <!-- Criar os cabeçalhos das linhas da tabela th = table header-->
                <th>Aluno</th>
                <th>Professor</th>
                <th>Disciplina</th>
                <th>Nota</th>
            </tr>
         </table>
    </main>
</body>
</html>
