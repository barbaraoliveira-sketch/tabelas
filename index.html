<!DOCTYPE html>
<html lang="pt-br">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplos de Tabelas</title>


    <!-- Link para os arquivos CSS -->
    <link rel="stylesheet" href="./css/global.css">
</head>


<body>
    <main class="main-content">


        <header class="header-title">
            <h1>Exemplo de tabelas</h1>
        </header>
        <!-- Container para a tabela -->
        <table class="table-alunos">
            <!-- Indicar o cabeçalho da tabela -->
            <thead>
            <tr>
                <th colspan="4" class="table-alunos__title">Notas 1DS - SESI</th>
            </tr>


                <tr>
                    <!-- Criar os cabeçalhos das linhas da tabela  th = table header-->
                    <th class="table-alunos__cabecalho">Aluno</th>
                    <th class="table-alunos__cabecalho">Professor</th>
                    <th class="table-alunos__cabecalho">Disciplina</th>
                    <th class="table-alunos__cabecalho">Nota</th>
                </tr>
            </thead>           


            <tbody>
                 <!-- Criar uma linha na tabela tr = table row -->
                <tr>
                    <td>Júlia</td>
                    <td>Celso</td>
                    <td>Física</td>
                    <td>10</td>
                </tr>
                <tr>
                    <td>Barbara</td>
                    <td>Liliane</td>
                    <td>Química</td>
                    <td>9,8</td>
                </tr>
                <tr>
                    <td>Davi</td>
                    <td>Sandra</td>
                    <td>Biologia</td>
                    <td>8,75</td>
                </tr>
            </tbody>


            <tfoot>
                <tr>
                    <th colspan="4" class="table-footer">Dados refentes ao 1º semestre de 2026 </th>
                </tr>
            </tfoot>




        </table>
    </main>
</body>


</html>
